<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>身体监测 · 教练端 · YouthFit</title>
<style>
  :root{ --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --brand:#0f6e56; --brand-bg:#eef7f3; --red:#A32D2D; --red-bg:#fcebeb; --amber:#8a5a00; --amber-bg:#faeeda; --green:#3B6D11; --green-bg:#eaf3de; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f2f4f7;}
  .wrap{max-width:860px; margin:0 auto; padding:14px 14px 44px;}
  .hd{background:var(--brand); color:#fff; border-radius:14px; padding:16px; margin-bottom:12px;}
  .hd h1{margin:0; font-size:19px;}
  .hd p{margin:6px 0 0; font-size:12.5px; opacity:.92; line-height:1.6;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{margin:0 0 10px; font-size:15px;}
  /* 代录表单：2×2 网格 —— 修复此前 flex 挤压导致的输入框互相遮挡 */
  .frow{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; margin-bottom:12px;}
  .frow .fld{min-width:0;}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  input,select{width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--brand); border-color:var(--brand);}
  .btn{display:inline-block; border:0; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:700; background:#e8edf2; color:var(--ink); cursor:pointer;}
  .btn.pri{background:var(--brand); color:#fff;}
  .btn.sm{padding:7px 12px; font-size:13.5px;}
  .btn.blk{width:100%;}
  .hint{font-size:12px; color:var(--muted); line-height:1.6;}
  .tblw{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  th{font-size:11.5px; color:var(--muted); font-weight:600; background:#f8fafc;}
  td.num,th.num{text-align:right;}
  tbody.tr-click{cursor:pointer}
  tbody.tr-click:hover td{background:#f8fafc}
  tbody.sel td{background:var(--brand-bg)}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center;}
  .stat .n{font-size:22px; font-weight:800;}
  .stat .l{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .stat.b .n{color:var(--red)} .stat.a .n{color:var(--amber)} .stat.g .n{color:var(--green)} .stat.n .n{color:#94a3b8}
  .tag{display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:700;}
  .t-bad{background:var(--red-bg); color:var(--red);}
  .t-warn{background:var(--amber-bg); color:var(--amber);}
  .t-ok{background:var(--green-bg); color:var(--green);}
  .t-na{background:#eef2f7; color:var(--muted);}
  .t-un{background:#fdf0e0; color:var(--amber);}
  .rec{display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px dashed var(--line); font-size:14px;}
  .rec:last-child{border-bottom:0;}
  .rec .sp{flex:1}
  .rec button{border:0; background:none; color:#b45309; cursor:pointer; font-size:15px; padding:2px 6px;}
  textarea{width:100%; min-height:90px; font-family:monospace; font-size:11px; padding:8px; border:1px solid var(--line); border-radius:10px; background:#f8fafc; color:var(--ink); word-break:break-all;}
  details summary{cursor:pointer; font-size:13px; color:var(--muted);}
  .note{padding:10px 12px; border-left:4px solid var(--brand); background:var(--brand-bg); border-radius:8px; font-size:13.5px; font-weight:600; line-height:1.7;}
  .note.bad{border-left-color:var(--red); background:var(--red-bg); color:var(--red);}
  .note.warn{border-left-color:var(--amber); background:var(--amber-bg); color:var(--amber);}
  .note.good{border-left-color:var(--green); background:var(--green-bg); color:var(--green);}
  .chart{width:100%; height:auto; display:block;}
  .ok{color:var(--brand); font-weight:700;}
  .sep{height:1px; background:var(--line); margin:12px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>📏 身体监测 · 教练端</h1>
    <p id="hdSub">与主帅端同一套算法评分（分低=需介入）：图表为主视图、团队按严重程度排序；可设每周目标（自动同步给主帅）；代录身高/体重<b>自动回传</b>（无需回传码）。</p>
  </div>
  <div id="app"><div class="card"><p class="hint">加载中…</p></div></div>
</div>

<script>
/* ══════════ 身体监测 · 主教练端（与 YouthFit 身体监测页同口径）══════════
 * 评分：快照 v3 直接携带主帅端 assessWeightNeed 的 sc/al/sl（不另写算法）——
 *   排序 = 等级（需介入→需关注→合理→待录入）→ 同级按分数从低到高（分低=更严重）。
 *   「需增肌」和超重一样是问题：低体重同样会被评为低分，排前面。
 * 图表：个人趋势图为详情卡第一屏（主视图），其余内容跟在后面。
 * 每周目标：教练可设，保存后随 <key>-ret 上云，主帅端拉取同步进他的每周目标表。
 * 代录：保存即自动上云 <key>-ret；主帅在 YouthFit「拉取主教练回传」一键合并。 */
function b64decUtf8(s){
  var bin=atob(s), b=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function b64encUtf8(str){
  var b=new TextEncoder().encode(str), s='';
  for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  return btoa(s);
}
var LS_SNAP='yf_coach_snap_last', LS_ENT='yf_coach_body_v1', LS_KEY='yf_coach_key_last';
function storedKey(){ try{ return localStorage.getItem(LS_KEY)||''; }catch(e){ return ''; } }
function rememberKey(k){ if(k){ try{ localStorage.setItem(LS_KEY,k); }catch(e){} } }
var SNAP=null, SNAP_SRC='';
var KEY_PARAM=(function(){ var m=location.search.match(/[?&]key=([0-9a-zA-Z_-]{6,60})/); return m?m[1]:''; })();
if(KEY_PARAM) rememberKey(KEY_PARAM);          /* 打开过一次短链，之后裸地址也知道去云端拉哪份 */
(function(){
  var h=location.hash.slice(1);
  if(h.indexOf('SNP1.')===0){ try{ SNAP=JSON.parse(b64decUtf8(h.slice(5))); SNAP_SRC='链接'; }catch(e){ SNAP=null; } }
  if((!SNAP || !SNAP.team || !SNAP.team.length) && window.__SNAP_INLINE){ SNAP=window.__SNAP_INLINE; SNAP_SRC='内嵌'; }
  if(!SNAP){
    try{
      var last=JSON.parse(localStorage.getItem(LS_SNAP)||'null');
      if(last && last.snap && last.snap.team && last.snap.team.length){ SNAP=last.snap; SNAP_SRC='缓存'; }
    }catch(e){}
  }
  if(SNAP && SNAP.team && SNAP.team.length){
    if(SNAP.key) rememberKey(SNAP.key);
    try{ localStorage.setItem(LS_SNAP, JSON.stringify({at:SNAP.at, snap:SNAP})); }catch(e){}
  }
})();
function $(id){ return document.getElementById(id); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function weekMon(){ var d=new Date(); var dw=(d.getDay()+6)%7; d.setDate(d.getDate()-dw); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function addDaysStr(ds,n){ var d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function loadEnt(){ try{ var o=JSON.parse(localStorage.getItem(LS_ENT)||'null'); return (o&&o.recs)?o:{recs:[]}; }catch(e){ return {recs:[]}; } }
var ENT=loadEnt();
function persistEnt(){ try{ localStorage.setItem(LS_ENT, JSON.stringify(ENT)); }catch(e){} }
/* 训练反馈表单元数据（与主帅端同口径）：17 测试项 × 5 位置画像 + 6 得分手段权重 */
var FB_META=[
  {k:'cmj',l:'纵跳 CMJ',u:'cm',gte:true},{k:'sj',l:'蹲跳 SJ',u:'cm',gte:true},
  {k:'bj_h',l:'跳箱高度',u:'cm',gte:true},{k:'dj_h',l:'跳深高度',u:'cm',gte:true},
  {k:'bs1rm',l:'后蹲相对力量',u:'×BW',gte:true},{k:'bp1rm',l:'卧推相对力量',u:'×BW',gte:true},
  {k:'pp1rm',l:'借力推相对力量',u:'×BW',gte:true},{k:'pc1rm',l:'高翻相对力量',u:'×BW',gte:true},
  {k:'snatch1rm',l:'抓举相对力量',u:'×BW',gte:true},{k:'cnj1rm',l:'挺举相对力量',u:'×BW',gte:true},
  {k:'pushup',l:'俯卧撑',u:'次',gte:true},{k:'pullup',l:'引体向上',u:'次',gte:true},
  {k:'hang',l:'屈臂悬垂',u:'s',gte:true},{k:'plank',l:'平板支撑',u:'s',gte:true},
  {k:'sprint10',l:'10m 冲刺',u:'s',gte:false},{k:'sprint20',l:'20m 冲刺',u:'s',gte:false},
  {k:'cod505',l:'505 变向',u:'s',gte:false}
];
var FB_MEANS=[
  {k:'spike',l:'扣球/强攻',d:'最主要得分手段：依赖纵跳高度、出手速度与上肢爆发'},
  {k:'serve',l:'发球',d:'跳发直接得分 / 破坏一传：依赖上肢爆发与动作连贯'},
  {k:'block',l:'拦网',d:'直接得分与限制：依赖纵跳、反应与核心稳定'},
  {k:'quick_attack',l:'快攻/战术攻',d:'副攻短平快、背飞：依赖节奏、协调与爆发'},
  {k:'backrow',l:'后排进攻',d:'立体进攻：依赖纵跳与核心'},
  {k:'defense',l:'防守反击',d:'防起后反击得分：依赖移动速度、灵敏与反应'}
];
var FB_POS=['主攻','副攻','接应','二传','自由人'];
var LS_FB='yf_coach_fb_v1';
function loadFb(){ try{ return JSON.parse(localStorage.getItem(LS_FB)||'{}')||{}; }catch(e){ return {}; } }
var FB=loadFb();
function persistFb(){ try{ localStorage.setItem(LS_FB, JSON.stringify(FB)); }catch(e){} }
/* 个人级反馈：{姓名:{b, means, prof, at}} —— 覆盖位置值；留空的项仍按位置 */
var LS_FBP='yf_coach_fbp_v1';
function loadFbp(){ try{ return JSON.parse(localStorage.getItem(LS_FBP)||'{}')||{}; }catch(e){ return {}; } }
var FB_PLAYER=loadFbp();
function persistFbp(){ try{ localStorage.setItem(LS_FBP, JSON.stringify(FB_PLAYER)); }catch(e){} }
function fbProfOfP(n,k){ var o=FB_PLAYER[n]; if(o&&o.prof&&o.prof[k]!=null) return o.prof[k]; return null; }
function fbMeanOfP(n,mid){ var o=FB_PLAYER[n]; if(o&&o.means&&o.means[mid]!=null) return o.means[mid]; return null; }
/* 反馈对象：2013/2014 出生 + 王梓昊，按位置分组 */
function fbEligible(){
  return (SNAP&&SNAP.team?SNAP.team:[]).filter(function(p){
    return /^201[34]$/.test(String(p.b||'')) || p.n==='王梓昊';
  });
}
function fbGroups(){
  var g={};
  fbEligible().forEach(function(p){
    var pos=String(p.p||'').split('/')[0].trim() || '未填位置';
    (g[pos]||(g[pos]=[])).push(p);
  });
  return g;
}
function fbProfOf(pos,k){
  if(FB[pos] && FB[pos].prof && FB[pos].prof[k]!=null) return FB[pos].prof[k];
  if(SNAP.prof && SNAP.prof[pos] && SNAP.prof[pos][k]!=null) return SNAP.prof[pos][k];
  return null;
}
function fbMeanOf(pos,mid){
  if(FB[pos] && FB[pos].means && FB[pos].means[mid]!=null) return FB[pos].means[mid];
  if(SNAP.means && SNAP.means[mid]!=null) return SNAP.means[mid];
  return 0;
}
/* 截止目标（本机）：{姓名: {t:目标kg, by:截止日}} —— 「到某日期降到某 kg」，随 <key>-ret 同步给主帅 */
var LS_G='yf_coach_goal_v1';
function loadG(){ try{ return JSON.parse(localStorage.getItem(LS_G)||'{}')||{}; }catch(e){ return {}; } }
var G=loadG();
function persistG(){ try{ localStorage.setItem(LS_G, JSON.stringify(G)); }catch(e){} }
function goalOf(p){
  var lg=G[p.n]; if(lg && lg.t && lg.by) return lg;
  return (p.goal && p.goal.t && p.goal.by) ? p.goal : null;   /* 主帅快照里带的 */
}
function findP(n){ return (SNAP&&SNAP.team?SNAP.team:[]).filter(function(x){ return x.n===n; })[0] || null; }
/* 称重史：v3 快照用 hist（全量）；老快照没有 hist 时退回 recs —— 老数据也能连成线 */
function histOf(p){ return (p && p.hist && p.hist.length) ? p.hist : ((p && p.recs) || []); }
function lastHFor(n){ var p=findP(n); if(p&&p.h) return p.h; for(var i=ENT.recs.length-1;i>=0;i--){ if(ENT.recs[i].n===n && ENT.recs[i].h) return ENT.recs[i].h; } return null; }
function retKey(){ var k=(SNAP&&SNAP.key)||KEY_PARAM||''; return k?k+'-ret':''; }
/* 严重度排序（与主帅端同口径）：快照 v3 带 sc/al —— 等级优先，同级分数从低到高（分低=最严重，排最前） */
var AL_PRI={bad:0, warn:1, low:2, ok:3, unknown:4};
function alOf(p){
  if(p.al) return p.al;
  if(p.lvl) return p.lvl;
  var st=String(p.st||'');                       /* v1 快照没有等级字段 → 按状态名推 */
  if(/肥胖/.test(st)) return 'bad';
  if(/超重|需减/.test(st)) return 'warn';
  if(/需增肌|偏瘦/.test(st)) return 'low';
  if(/正常|合理/.test(st)) return 'ok';
  return 'unknown';
}
function scOf(p){ return (typeof p.sc==='number') ? p.sc : null; }
function stTag(st){ st=String(st||'无数据');
  if(/肥胖|需介入/.test(st)) return '<span class="tag t-bad">🔴 '+esc(st)+'</span>';
  if(/超重|需减|关注/.test(st)) return '<span class="tag t-warn">🟡 '+esc(st)+'</span>';
  if(/需增肌/.test(st)) return '<span class="tag t-warn">🔽 '+esc(st)+'</span>';
  if(/正常|合理/.test(st)) return '<span class="tag t-ok">🟢 '+esc(st)+'</span>';
  return '<span class="tag t-na">'+esc(st)+'</span>'; }
function srOf(p){
  if(p.sr) return p.sr;                              /* 快照 v3：电脑端算好的短因 */
  var st=String(p.st||'');
  if(/肥胖|超重/.test(st)) return '需减重';
  if(/需增肌|偏瘦/.test(st)) return '需增肌';
  if(/正常/.test(st)) return '合理';
  return '—';
}
function statusTag(p){                               /* 与电脑端团队表完全同款 */
  var al=alOf(p), txt=srOf(p);
  if(al==='bad')  return '<span class="tag t-bad">🔴 '+esc(txt)+'</span>';
  if(al==='warn') return '<span class="tag t-warn">🟡 '+esc(txt)+'</span>';
  if(al==='low')  return '<span class="tag t-warn">🟡 '+esc(txt)+'</span>';
  if(al==='ok')   return '<span class="tag t-ok">🟢 '+esc(txt)+'</span>';
  return '<span class="tag t-na">—</span>';
}
function bdOf(p){ return p.bd || (p.b ? p.b : '—'); }   /* 出生日期：v3 带全日期，老快照回落出生年 */
function scoreTag(p){
  var sc=scOf(p), al=alOf(p);
  if(sc==null) return '<span class="tag t-na">—</span>';
  var cls = al==='bad'?'t-bad':(al==='warn'?'t-warn':(al==='low'?'t-warn':(al==='ok'?'t-ok':'t-na')));
  return '<span class="tag '+cls+'">'+sc+'</span>';
}
function goalLine(p){
  var g=goalOf(p); if(!g || !p.w) return '';
  var need=Math.round((p.w-g.t)*10)/10;
  if(!need) return '';
  var days=Math.round((new Date(g.by+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000);
  if(days<=0) return '<div class="hint" style="margin-top:4px">🎯 截止目标：'+esc(g.by)+' 已到 —— 当前 '+p.w+'kg'+(need>0?('，未到 '+g.t+'kg'):'（已达标）')+'</div>';
  var weeks=days/7, rate=Math.abs(need)/weeks;
  var col = rate<=0.5 ? 'var(--green)' : (rate<=0.75 ? 'var(--amber)' : 'var(--red)');
  var verdict = rate<=0.5 ? '✓ 安全速率内' : (rate<=0.75 ? '⚠ 略超安全速率' : '❌ 超过安全速率，建议调整目标或延期');
  return '<div class="hint" style="margin-top:4px">🎯 截止目标：'+p.w+'kg → '+(need>0?'减到':'增到')+' <b>'+g.t+'kg</b>（'+esc(g.by)+'）· 还差 <b>'+Math.abs(need)+'kg</b> · 剩 '+weeks.toFixed(1)+' 周 · 需 <b style="color:'+col+'">'+rate.toFixed(2)+'kg/周</b> '+verdict+'</div>';
}
function verdict(target, actual){
  if(target==null) return '<span class="tag t-na">未设目标</span>';
  if(actual==null) return '<span class="tag t-na">未称重</span>';
  var diff=Math.round((actual-target)*10)/10;
  return (diff>0?'+':'')+diff+'kg '+(Math.abs(diff)<=0.5?'<span class="tag t-ok">✓达标</span>':'<span class="tag t-bad">✗未达</span>');
}
function curWeekTarget(p){
  if(!p||!p.wt||!p.wt.length) return null;   /* 每周目标由主帅在 YouthFit 设，教练端只读 */
  var wk=weekMon(); for(var i=0;i<p.wt.length;i++){ if(p.wt[i][0]===wk) return p.wt[i][1]; } return null;
}
function sortedTeam(){
  var t=(SNAP&&SNAP.team?SNAP.team:[]).slice();
  t.sort(function(a,b){
    var sa=scOf(a), sb=scOf(b);
    if(sa!=null && sb!=null && sa!==sb) return sa-sb;   /* 分数从低到高：分低=更严重，排最前（需增肌和超重同权竞争） */
    var ra=AL_PRI[alOf(a)]!=null?AL_PRI[alOf(a)]:9, rb=AL_PRI[alOf(b)]!=null?AL_PRI[alOf(b)]:9;
    if(ra!==rb) return ra-rb;                            /* 没分数的老快照 → 按等级 */
    return (b.bmi||0)-(a.bmi||0);
  });
  return t;
}
/* 选中人：会话内记住（sessionStorage）—— 每次新打开链接默认回到 陶梓乐 */
function selName(){ try{ return sessionStorage.getItem('yf_coach_sel')||''; }catch(e){ return ''; } }
function setSelName(n){ try{ sessionStorage.setItem('yf_coach_sel', n); }catch(e){} }
/* ── 图表文字避让（2026-09-17）────────────────────────────────────────
   体重图上最多有 5 处文字可能互相压住：Y 轴刻度 / 日期 / 位置标准 / 本周目标 /
   截止目标 / 最新体重。SVG 里量不到真实文字宽度，只能自己估：
   全角按 1.0em、数字 0.58em、拉丁字母 0.56em、空格 0.30em。
   放每个标签时先算出候选位置的矩形，挑第一个「不与已放好的标签相交」的；
   实在都相交，就取重叠面积最小的那个。这样数据怎么变都不会糊成一团。
   （电脑端工具箱 youthfit.html 的 weightTrendSVG 用的是同一套，改一处要同步另一处） */
function svgTextW(s, fs){
  s=String(s); var w=0;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c>0x2e80) w+=1.0;                             /* 中日韩全角 */
    else if(c>=48&&c<=57) w+=0.58;                   /* 数字 */
    else if((c>=65&&c<=90)||(c>=97&&c<=122)) w+=0.56;/* 拉丁字母 */
    else if(c===32) w+=0.30;                         /* 空格 */
    else w+=0.45;                                    /* · . % 等 */
  }
