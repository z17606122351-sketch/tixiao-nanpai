<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>即训即录 · 上海市体校男排</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#e3e8ef;--txt:#1f2937;--mut:#6b7280;--brand:#0f6e56;--brand-l:#e1f5ee;--amber:#b45309;--amber-l:#faeeda;--done:#e8f7f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:92px}
header{position:sticky;top:0;z-index:9;background:var(--brand);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:8px}
header b{font-size:16px;font-weight:500}
header .sub{font-size:12px;opacity:.85;margin-left:auto;text-align:right}
.tabs{position:sticky;top:42px;z-index:8;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px 8px;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;white-space:nowrap}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .n{font-size:12px;opacity:.75;margin-left:5px}
.bar2{display:flex;gap:8px;align-items:center;padding:9px 12px 0}
.bar2 .p{font-size:12.5px;color:var(--mut);flex:1}
.btn{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13.5px;color:var(--txt)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.wrap{padding:8px 12px 12px}
.row{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.row.done{background:var(--done);border-color:#9fd9c4}
.row .line1{display:flex;align-items:center;gap:8px}
.row .nm{font-weight:500;font-size:15px;flex:0 0 auto;min-width:56px}
.row .pl{font-size:12px;color:var(--mut);flex:1;line-height:1.35;display:block}
.row .pl b{color:var(--amber);font-weight:500}
.row .pl .pr{color:var(--brand);display:block}
.big{padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:15px;min-width:78px}
.big.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tune{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tune button{padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;color:var(--mut)}
.tune input{padding:7px 9px;border:1px solid var(--line);border-radius:9px;font-size:15px;width:100%;font-family:ui-monospace,Menlo,monospace;margin-top:6px}
.miss{font-size:12px;color:var(--amber)}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:10px;align-items:center}
footer .st{font-size:12px;color:var(--mut)}
footer .send{flex:1;padding:12px 0;border-radius:12px;font-size:16px;border:0;background:var(--brand);color:#fff;font-weight:500}
footer .send[disabled]{background:#cbd5e1}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mut);font-size:14px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;max-width:88%;text-align:center}
.toast.on{opacity:.95}
.hintline{font-size:12px;color:var(--mut);padding:0 12px 6px}
.fx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-top:12px}
.fx .hd{font-size:14px;font-weight:500;margin-bottom:7px}
.fx .hd .sub{font-size:11.5px;color:var(--mut);font-weight:400;margin-left:6px}
.fxline{display:flex;gap:6px;margin-bottom:6px}
.fxline select,.fxline input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--fg)}
.fxlive{font-size:11.5px;color:var(--mut);padding:2px 0 4px;line-height:1.5}
.fxrow{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line)}
.fxrow .fxnm{font-weight:500}
.fxrow .fxex{color:#0f6e56}
.fxrow .fxpr{flex:1;color:var(--mut)}
.fxrow button{padding:3px 9px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--fg)}
</style>
</head>
<body>
<header><b>即训即录</b><span class="sub" id="hdr">加载中…</span></header>
<div id="tabs" class="tabs"></div>
<div class="bar2">
  <span class="p" id="prog"></span>
  <button class="btn" onclick="allDone()">✓ 全队按计划完成</button>
</div>
<div class="hintline" id="hint"></div>
<div class="wrap" id="app"></div>
<footer>
  <span class="st" id="st"></span>
  <button class="send" id="send" onclick="send()">📤 一键回传</button>
</footer>
<div class="toast" id="toast"></div>
<script>
var API='https://textdb.online';
var Q=new URLSearchParams(location.search);
var KEY=Q.get('key')||'tixiao-nanpai-2026';
var DAY=null, LOG={}, SENT={}, OPEN={}, curEx=null;
var fxAth='', fxEx='', fxIn='';
/* 自由录入（突破测试）常用动作：可下拉选，也可自己输 */
var FX_LIST=['抓举','高悬垂抓举','高翻','悬垂高翻','挺举','后蹲','前蹲','卧推','借力推','站姿推举','杠铃划船','罗马尼亚硬拉','深蹲跳','跳箱','负重提踵','杠铃腕弯举','引体向上','等长弓步蹲'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(t,ms){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('on'); }, ms||2200); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* 口令解析：80x5 85x5 85x4 ／ 80*5 ／ 80×5 ／ 80 5 */
function parseTok(s){
  var out=[], re=/(-?\d+(?:\.\d+)?)\s*(?:[x×*]|\s)\s*(\d+)/g, m, rest=String(s||'');
  while((m=re.exec(rest))){ var w=parseFloat(m[1]), r=parseInt(m[2],10); if(w>0&&r>0&&r<=60) out.push([w,r]); }
  return out;
}
/* PR 估算：Epley 与 Brzycki 取保守值；≤8 次才计入 */
function est1RM(w,r){
  if(!(w>0) || !(r>0) || r>8) return null;
  var epley=w*(1+r/30), brz=(r<37)? w*36/(37-r) : null;
  var v=(brz==null)? epley : Math.min(epley,brz);
  return Math.round(v*10)/10;
}
function num(s){ var v=parseFloat(String(s==null?'':s)); return isNaN(v)?null:v; }
function lsk(){ return 'yflog_'+KEY+'_'+((DAY&&DAY.at)||todayStr()); }
function loadLocal(){ try{ var o=JSON.parse(localStorage.getItem(lsk())||'{}'); LOG=o.log||{}; SENT=o.sent||{}; OPEN=o.open||{}; }catch(e){ LOG={}; SENT={}; OPEN={}; } }
function saveLocal(){ try{ localStorage.setItem(lsk(), JSON.stringify({log:LOG, sent:SENT, open:OPEN})); }catch(e){} }
function planNum(reps){ var n=parseInt(String(reps).replace(/[^\d]/g,''),10); return n||0; }
function exList(){ var seen={}, out=[]; DAY.items.forEach(function(it){ it.ex.forEach(function(e){ if(!seen[e.name]){ seen[e.name]=1; out.push(e.name); } }); }); return out; }
function exOf(it, name){ return it.ex.filter(function(e){ return e.name===name; })[0] || null; }
function tokOf(athId, name){ return ((LOG[athId]||{})[name]||'').trim(); }
function isDone(it, name){ return !!tokOf(it.athId, name); }

/* ── 自由录入 · 突破测试（2026-09-14）──
 * 想到更新谁、哪个动作，就选谁 + 填「重量×次数」，支持多组、任意次数（≤8 次才倒推 1RM）。
 * 与点名数据一起回传：电脑端拉取时若推算值高于档案 1RM，会自动写成一条新的测验记录。 */
function fxBest(tok){
  var best=null; parseTok(tok).forEach(function(s){ var v=est1RM(s[0],s[1]); if(v&&(!best||v>best)) best=v; });
  return best;
}
function fxLive(){
  var el=$('fxlive'); if(!el) return;
  var tok=$('fxSets')?$('fxSets').value:'';
  var sets=parseTok(tok);
  if(!sets.length){ el.textContent='格式：重量×次数，可多组 —— 例 100x5 105x3（次数 >8 只记训练量，不倒推 1RM）'; return; }
  var parts=sets.map(function(s){ var v=est1RM(s[0],s[1]); return s[0]+'×'+s[1]+'→'+(v==null?'—':v+'kg'); });
  var b=fxBest(tok);
  var tip = (b==null) ? '　<span style="color:#b45309">次数超过 8，不倒推 1RM（只记训练量）</span>' : '';
  el.innerHTML=esc(parts.join('  '))+'　<b style="color:#0f6e56">最佳估算 '+(b==null?'—':b+'kg')+'</b>'+tip;
}
function fxAdd(){
  var ath=$('fxAth').value, nm=($('fxEx').value||'').trim(), tok=($('fxSets').value||'').trim();
  if(!nm){ toast('先选/填一个动作'); return; }
  if(!parseTok(tok).length){ toast('格式形如 100x5 105x3'); return; }
  OPEN[ath]=OPEN[ath]||{};
  var old=OPEN[ath][nm];
  var merged=((old&&old.sets)?old.sets+' ':'')+tok;
  OPEN[ath][nm]={sets:merged, est:fxBest(merged), ts:Date.now()};
  saveLocal(); render();
  var it=byId(ath);
  toast('已加入：'+(it?it.name:'')+' '+nm+' → 估算 '+(fxBest(merged)==null?'—':fxBest(merged)+'kg'), 2600);
}
function fxDel(athId, nm){ if(OPEN[athId]){ delete OPEN[athId][nm]; if(!Object.keys(OPEN[athId]).length) delete OPEN[athId]; } saveLocal(); render(); }
function openCard(){
  var opts=DAY.items.map(function(it){ return '<option value="'+esc(it.athId)+'"'+(it.athId===fxAth?' selected':'')+'>'+esc(it.name)+'</option>'; }).join('');
  var list=FX_LIST.map(function(n){ return '<option value="'+esc(n)+'"></option>'; }).join('');
  var rows='';
  Object.keys(OPEN).forEach(function(aid){
    var it=byId(aid); if(!it) return;
    Object.keys(OPEN[aid]).forEach(function(nm){
      var o=OPEN[aid][nm];
      rows+='<div class="fxrow"><span class="fxnm">'+esc(it.name)+'</span><span class="fxex">'+esc(nm)+'</span>'+
        '<span class="fxpr">'+esc(o.sets)+' → '+(o.est==null?'—':'<b>'+o.est+'kg</b>')+'</span>'+
        '<button onclick="fxDel(\''+aid+'\',\''+esc(nm)+'\')">删</button></div>';
    });
  });
  return '<div class="fx"><div class="hd">自由录入 · 突破测试<span class="sub">想更新谁、哪个动作就填谁 · 多 RM 自动倒推 1RM</span></div>'+
    '<div class="fxline"><select id="fxAth" onchange="fxAth=this.value">'+opts+'</select>'+
      '<input id="fxEx" list="fxListSrc" placeholder="动作（可选可自输）" value="'+esc(fxEx)+'" onchange="fxEx=this.value">'+
      '<datalist id="fxListSrc">'+list+'</datalist></div>'+
    '<div class="fxline"><input id="fxSets" placeholder="100x5 105x3" value="'+esc(fxIn)+'" oninput="fxIn=this.value;fxLive()">'+
      '<button class="big" style="flex:0 0 auto" onclick="fxAdd()">＋ 加入</button></div>'+
    '<div class="fxlive" id="fxlive"></div>'+
    (rows?('<div class="fxlist">'+rows+'</div>'):'')+
  '</div>';
}
fetch(API+'/'+encodeURIComponent(KEY)+'-day').then(function(r){ return r.text(); }).then(function(t){
  if(!t){ $('hdr').textContent='云端无今日课表'; $('app').innerHTML='<div class="empty">电脑端还没上传今日课表<br><br>请在 YouthFit「训练记录」页点<br><b>📤 上传今日课表到手机端</b></div>'; $('send').disabled=true; return; }
  DAY=JSON.parse(t); loadLocal();
  $('hdr').innerHTML=esc(DAY.at)+' · 周'+DAY.day;
  var L=exList(); if(!curEx||L.indexOf(curEx)<0) curEx=L[0];
  render();
}).catch(function(e){
  $('hdr').textContent='网络异常';
  $('app').innerHTML='<div class="empty">读取课表失败：'+esc(e)+'<br><br>检查网络后刷新</div>';
});

/* 点一下 = 该队员这个动作按计划完成（默认全部组：refW×计划次数） */
function mark(it, name, on){
  var e=exOf(it,name); if(!e) return;
  if(!on){ LOG[it.athId]=LOG[it.athId]||{}; delete LOG[it.athId][name]; }
  else{
    if(e.refW==null){ toast('「'+it.name+'」'+name+' 没有参考重量 —— 展开手输（如 60x5）'); return; }
    var reps=planNum(e.reps)||5, n=parseInt(String(e.sets),10)||3, arr=[];
    for(var k=0;k<n;k++) arr.push(e.refW+'x'+reps);
    LOG[it.athId]=LOG[it.athId]||{}; LOG[it.athId][name]=arr.join(' ');
  }
  saveLocal(); render();
}
function toggle(athId, name){ var it=byId(athId); mark(it, name, !isDone(it,name)); }
function byId(id){ return DAY.items.filter(function(x){ return x.athId===id; })[0]; }
/* 微调：改所有组的重量 / 次数（保留组数） */
function adj(athId, name, dw, dr){
  var it=byId(athId), sets=parseTok(tokOf(athId,name));
  if(!sets.length) return;
  var out=sets.map(function(s){
    var w=Math.max(2.5, Math.round((s[0]+dw)*10)/10), r=Math.max(1, s[1]+dr);
    return w+'x'+r;
  });
  LOG[athId][name]=out.join(' '); saveLocal(); render();
}
/* 组数快捷增减：+1 = 复制最后一组；−1 = 删最后一组（最少保留 1 组） */
function adjSets(athId, name, delta){
  var it=byId(athId), sets=parseTok(tokOf(athId,name));
  var e=exOf(it,name);
  if(!sets.length && e && e.refW!=null){          /* 还没点名就从计划生成 */
    var reps=planNum(e.reps)||5, n=parseInt(String(e.sets),10)||3, arr=[];
    for(var k=0;k<n;k++) arr.push(e.refW+'x'+reps);
    sets=arr.map(function(t){ return parseTok(t)[0]; });
  }
  if(!sets.length) return;
  if(delta>0){ var last=sets[sets.length-1]; sets.push([last[0], last[1]]); }
  else if(delta<0){ if(sets.length<=1){ toast('至少留 1 组'); return; } sets.pop(); }
  LOG[athId]=LOG[athId]||{};
  LOG[athId][name]=sets.map(function(x){ return x[0]+'x'+x[1]; }).join(' ');
  saveLocal(); render();
  toast(athId ? (byId(athId).name+' '+name+' → '+sets.length+' 组') : '', 1200);
}
function setTok(athId, name, v){ LOG[athId]=LOG[athId]||{}; if(v.trim()) LOG[athId][name]=v.trim(); else delete LOG[athId][name]; saveLocal(); render(); }
function allDone(){
  var n=0;
  DAY.items.forEach(function(it){
    var e=exOf(it,curEx); if(!e || e.refW==null) return;
    if(!isDone(it,curEx)){ mark(it,curEx,true); n++; }
  });
  toast(n? ('已标记 '+n+' 人按计划完成 '+curEx) : '该动作大家都已标记', 1600);
}
function render(){
  var L=exList();
  $('tabs').innerHTML=L.map(function(n){
    var done=DAY.items.filter(function(it){ return exOf(it,n) && isDone(it,n); }).length;
    var tot=DAY.items.filter(function(it){ return exOf(it,n); }).length;
    return '<div class="tab'+(n===curEx?' on':'')+'" onclick="curEx=\''+esc(n)+'\';render()">'+esc(n)+'<span class="n">'+done+'/'+tot+'</span></div>';
  }).join('');
  var rows=DAY.items.map(function(it){
    var e=exOf(it,curEx);
    if(!e) return '<div class="row"><div class="line1"><span class="nm">'+esc(it.name)+'</span><span class="pl">今日无此动作</span></div></div>';
    var tok=tokOf(it.athId,curEx), done=!!tok, sets=parseTok(tok);
    var best=null; sets.forEach(function(s){ var v=est1RM(s[0],s[1]); if(v&&(!best||v>best)) best=v; });
    var planTxt=(e.refW!=null? '<b>'+e.refW+'kg</b> ':'<span class="miss">需手输重量</span> ')+'× '+e.sets+' 组 × '+(planNum(e.reps)||'')+' 次';
    var detail = done? ('<span class="pr">已记 '+(sets.length?sets.length:0)+' 组'+(best?(' · 估算 PR '+best+'kg'):'')+'</span>')
                     : '<span class="pr" style="color:var(--mut)">未录 = 按计划完成</span>';
    var tune = done? ('<div class="tune">'+
        '<button onclick="adjSets(\''+it.athId+'\',\''+esc(curEx)+'\',1)">＋1 组</button>'+
        '<button onclick="adjSets(\''+it.athId+'\',\''+esc(curEx)+'\',-1)">－1 组</button>'+
        '<button onclick="adj(\''+it.athId+'\',\''+esc(curEx)+'\',2.5,0)">重+2.5</button>'+
        '<button onclick="adj(\''+it.athId+'\',\''+esc(curEx)+'\',-2.5,0)">重−2.5</button>'+
        '<button onclick="adj(\''+it.athId+'\',\''+esc(curEx)+'\',0,1)">次+1</button>'+
        '<button onclick="adj(\''+it.athId+'\',\''+esc(curEx)+'\',0,-1)">次−1</button>'+
        '<button onclick="reset(\''+it.athId+'\')">重置</button></div>'+
        '<input value="'+esc(tok)+'" placeholder="精修：80x5 80x5 77.5x4" onchange="setTok(\''+it.athId+'\',\''+esc(curEx)+'\',this.value)">')
      : '';
    return '<div class="row'+(done?' done':'')+'">'+
      '<div class="line1"><span class="nm">'+esc(it.name)+'</span>'+
      '<span class="pl">'+planTxt+detail+'</span>'+
      '<button class="big'+(done?' on':'')+'" onclick="toggle(\''+it.athId+'\',\''+esc(curEx)+'\')">'+(done?'✓ 已录':'完成')+'</button></div>'+
      tune+
      '</div>';
  }).join('');
  $('app').innerHTML=rows+openCard();
  var doneAll=DAY.items.filter(function(it){ return exOf(it,curEx) && isDone(it,curEx); }).length;
  var totAll=DAY.items.filter(function(it){ return exOf(it,curEx); }).length;
  $('prog').textContent=curEx+'：'+doneAll+'/'+totAll+' 人已录';
  $('hint').textContent='点「完成」= 按计划记满全部组；少做了就点「－1 组」，重量/次数用 ± 调，或展开精修。';
  var total=0, hit=0;
  DAY.items.forEach(function(it){ exList().forEach(function(n){ if(exOf(it,n)){ total++; if(isDone(it,n)) hit++; } }); });
  $('st').textContent=hit+'/'+total+' 格';
  var openN=0; Object.keys(OPEN).forEach(function(k){ openN+=Object.keys(OPEN[k]).length; });
  $('send').disabled=(hit===0 && openN===0);
}
function reset(athId){ delete LOG[athId][curEx]; saveLocal(); render(); }
async function send(){
  var items=DAY.items.filter(function(it){ return Object.keys(LOG[it.athId]||{}).some(function(k){ return (LOG[it.athId][k]||'').trim(); }) || Object.keys(OPEN[it.athId]||{}).length; });
  if(!items.length){ toast('还没有录入任何数据'); return; }
  $('send').disabled=true; $('send').textContent='回传中…';
  try{
    var old=[]; try{ var t=await fetch(API+'/'+encodeURIComponent(KEY)+'-log').then(function(r){ return r.text(); }); old=t?JSON.parse(t):[]; }catch(e){ old=[]; }
    if(!Array.isArray(old)) old=[];
    items.forEach(function(it){
      var r=LOG[it.athId]||{}, ex=[], pr={};
      it.ex.forEach(function(e){
        var sets=parseTok(r[e.name]||''); if(!sets.length) return;
        ex.push({name:e.name, plan:e.sets+'×'+e.reps, sets:sets});
        var best=null; sets.forEach(function(s){ var v=est1RM(s[0],s[1]); if(v&&(!best||v>best)) best=v; });
        if(best!=null) pr[e.name]=best;
      });
      /* 自由录入（突破测试）：任何动作、任何次数，合并进同一份回传 */
      var op=OPEN[it.athId]||{};
      Object.keys(op).forEach(function(nm){
        var sets=parseTok(op[nm].sets); if(!sets.length) return;
        ex.push({name:nm, plan:'自由录入', sets:sets});
        var b=null; sets.forEach(function(s){ var v=est1RM(s[0],s[1]); if(v&&(!b||v>b)) b=v; });
        if(b!=null && (pr[nm]==null || b>pr[nm])) pr[nm]=b;
      });
      if(!ex.length) return;
      old=old.filter(function(x){ return !(x.at===DAY.at && x.athId===it.athId); });
      old.push({at:DAY.at, athId:it.athId, name:it.name, ex:ex, pr:pr, ts:Date.now()});
      SENT[it.athId]=1;
    });
    var body='key='+encodeURIComponent(KEY+'-log')+'&value='+encodeURIComponent(JSON.stringify(old));
    var res=await fetch(API+'/update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(r){ return r.json(); });
    if(res.status!==1) throw new Error('云端返回 '+JSON.stringify(res).slice(0,60));
    saveLocal(); render();
    toast('✅ 已回传 '+items.length+' 人 —— 电脑端点「拉取训练记录」并入', 3000);
  }catch(e){ toast('回传失败：'+e+'（数据已存本机）', 3500); }
  $('send').disabled=false; $('send').textContent='📤 一键回传';
}
</script>
</body>
</html>
