<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>即训即录 · 上海市体校男排</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#e3e8ef;--txt:#1f2937;--mut:#6b7280;--brand:#0f6e56;--brand-l:#e1f5ee;--amber:#b45309;--amber-l:#faeeda;--done:#e8f7f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:92px}
header{position:sticky;top:0;z-index:9;background:var(--brand);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:8px}
header b{font-size:16px;font-weight:500}
header .sub{font-size:12px;opacity:.85;margin-left:auto;text-align:right}
.bar2{display:flex;gap:8px;align-items:center;padding:9px 12px 0}
.bar2 .p{font-size:12.5px;color:var(--mut);flex:1}
.wrap{padding:8px 12px 12px}
.big{padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:15px;min-width:78px}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:10px;align-items:center}
footer .st{font-size:12px;color:var(--mut)}
footer .send{flex:1;padding:12px 0;border-radius:12px;font-size:16px;border:0;background:var(--brand);color:#fff;font-weight:500}
footer .send[disabled]{background:#cbd5e1}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mut);font-size:14px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;max-width:88%;text-align:center}
.toast.on{opacity:.95}
.hintline{font-size:12px;color:var(--mut);padding:0 12px 6px}
.fx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-top:12px}
.fx .hd{font-size:14px;font-weight:500;margin-bottom:7px}
.fx .hd .sub{font-size:11.5px;color:var(--mut);font-weight:400;margin-left:6px}
.fxline{display:flex;gap:6px;margin-bottom:6px}
.fxline select,.fxline input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--fg)}
.fxlive{font-size:11.5px;color:var(--mut);padding:2px 0 4px;line-height:1.5}
.fxrow{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line)}
.fxrow .fxnm{font-weight:500}
.fxrow .fxex{color:#0f6e56}
.fxrow .fxpr{flex:1;color:var(--mut)}
.fxrow button{padding:3px 9px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--fg)}

/* ── 全队一张表（2026-09-18）：行=动作 / 列=队员 ──────────────────
   与电脑端 A4 打印表同源数据；手机上横向滑动看队员，首列动作名冻结。 */
/* 表头吸顶（2026-09-21）：外层必须是**有界高度**的滚动容器。
   ⚠️ 原来只写 overflow-x:auto —— 按 CSS 规则这会让 overflow-y 也跟着变 auto，
   盒子成了滚动容器、但高度随内容走、永远不纵向滚动，
   于是 thead 的 position:sticky;top:0 形同失效，队员名一滚就走。
   高度由 fitMx() 按视口实算后写进 style.maxHeight。 */
.mxwrap{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 12px}
table.mx{border-collapse:separate;border-spacing:0;background:#fff;font-size:13px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:6px 7px;white-space:nowrap}
table.mx thead th{position:sticky;top:0;background:#f8fafc;font-size:11.5px;color:var(--mut);
                  font-weight:500;z-index:2;box-shadow:0 1px 0 var(--line)}
table.mx th.mxfx,table.mx td.mxfx{position:sticky;left:0;background:#fff;z-index:1;
  text-align:left;max-width:130px;white-space:normal;font-size:12.5px;box-shadow:1px 0 0 var(--line)}
table.mx thead th.mxfx{background:#f8fafc;z-index:3}
table.mx td.mxfx{font-weight:500}
table.mx td.mxfx em{font-style:normal;font-size:10.5px;color:var(--amber);
                    border:1px solid var(--amber-l);background:var(--amber-l);border-radius:5px;padding:0 4px}
table.mx tr.mxseg td{background:#eef7f3;color:var(--brand);font-size:11.5px;font-weight:600;padding:4px 8px}
table.mx tr.mxadd td.mxfx{color:var(--amber)}
table.mx td.mxna{color:#94a3b8;text-align:center}
table.mx td.mxcell{padding:3px 4px}
table.mx td.mxpx,table.mx th.mxpx{color:var(--mut);font-size:12px}
input.mxi{width:64px;padding:6px 4px;font-size:14px;text-align:center;border:1px solid var(--line);
          border-radius:8px;background:#fff;font-family:ui-monospace,Menlo,monospace;color:#94a3b8}
input.mxi:focus{outline:2px solid var(--brand);color:var(--txt)}
input.mxi.filled{color:var(--txt);font-weight:600;background:var(--done);border-color:#9fd9c4}
input.mxi.bad{color:var(--amber);border-color:var(--amber);background:var(--amber-l)}
</style>
</head>
<body>
<header><b>即训即录</b><span class="sub" id="hdr">加载中…</span></header>
<div class="bar2">
  <span class="p" id="prog"></span>
</div>
<div class="hintline" id="hint"></div>
<div class="wrap" id="app"></div>
<footer>
  <span class="st" id="st"></span>
  <button class="send" id="send" onclick="send()">📤 一键回传</button>
</footer>
<div class="toast" id="toast"></div>
<script>
var API='https://textdb.online';
var Q=new URLSearchParams(location.search);
var KEY=Q.get('key')||'tixiao-nanpai-2026';
var DAY=null, LOG={}, SENT={}, OPEN={};
var fxAth='', fxEx='', fxIn='';
/* 自由录入（突破测试）常用动作：可下拉选，也可自己输 */
var FX_LIST=['抓举','高悬垂抓举','高翻','悬垂高翻','挺举','后蹲','前蹲','卧推','借力推','站姿推举','杠铃划船','罗马尼亚硬拉','深蹲跳','跳箱','负重提踵','杠铃腕弯举','引体向上','等长弓步蹲'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(t,ms){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('on'); }, ms||2200); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* 口令解析：80x5 85x5 85x4 ／ 80*5 ／ 80×5 ／ 80 5 */
function parseTok(s){
  var out=[], re=/(-?\d+(?:\.\d+)?)\s*(?:[x×*]|\s)\s*(\d+)/g, m, rest=String(s||'');
  while((m=re.exec(rest))){ var w=parseFloat(m[1]), r=parseInt(m[2],10); if(w>0&&r>0&&r<=60) out.push([w,r]); }
  return out;
}
/* PR 估算：Epley 与 Brzycki 取保守值；≤8 次才计入 */
function est1RM(w,r){
  if(!(w>0) || !(r>0) || r>8) return null;
  var epley=w*(1+r/30), brz=(r<37)? w*36/(37-r) : null;
  var v=(brz==null)? epley : Math.min(epley,brz);
  return Math.round(v*10)/10;
}
function num(s){ var v=parseFloat(String(s==null?'':s)); return isNaN(v)?null:v; }
function lsk(){ return 'yflog_'+KEY+'_'+((DAY&&DAY.at)||todayStr()); }
function loadLocal(){ try{ var o=JSON.parse(localStorage.getItem(lsk())||'{}'); LOG=o.log||{}; SENT=o.sent||{}; OPEN=o.open||{}; }catch(e){ LOG={}; SENT={}; OPEN={}; } }
function saveLocal(){ try{ localStorage.setItem(lsk(), JSON.stringify({log:LOG, sent:SENT, open:OPEN})); }catch(e){} }

/* ── 自由录入 · 突破测试（2026-09-14）──
 * 想到更新谁、哪个动作，就选谁 + 填「重量×次数」，支持多组、任意次数（≤8 次才倒推 1RM）。
 * 与点名数据一起回传：电脑端拉取时若推算值高于档案 1RM，会自动写成一条新的测验记录。 */
function fxBest(tok){
  var best=null; parseTok(tok).forEach(function(s){ var v=est1RM(s[0],s[1]); if(v&&(!best||v>best)) best=v; });
  return best;
}
function fxLive(){
  var el=$('fxlive'); if(!el) return;
  var tok=$('fxSets')?$('fxSets').value:'';
  var sets=parseTok(tok);
  if(!sets.length){ el.textContent='格式：重量×次数，可多组 —— 例 100x5 105x3（次数 >8 只记训练量，不倒推 1RM）'; return; }
  var parts=sets.map(function(s){ var v=est1RM(s[0],s[1]); return s[0]+'×'+s[1]+'→'+(v==null?'—':v+'kg'); });
  var b=fxBest(tok);
  var tip = (b==null) ? '　<span style="color:#b45309">次数超过 8，不倒推 1RM（只记训练量）</span>' : '';
  el.innerHTML=esc(parts.join('  '))+'　<b style="color:#0f6e56">最佳估算 '+(b==null?'—':b+'kg')+'</b>'+tip;
}
function fxAdd(){
  var ath=$('fxAth').value, nm=($('fxEx').value||'').trim(), tok=($('fxSets').value||'').trim();
  if(!nm){ toast('先选/填一个动作'); return; }
  if(!parseTok(tok).length){ toast('格式形如 100x5 105x3'); return; }
  OPEN[ath]=OPEN[ath]||{};
  var old=OPEN[ath][nm];
  var merged=((old&&old.sets)?old.sets+' ':'')+tok;
  OPEN[ath][nm]={sets:merged, est:fxBest(merged), ts:Date.now()};
  saveLocal(); render();
  var it=byId(ath);
  toast('已加入：'+(it?it.name:'')+' '+nm+' → 估算 '+(fxBest(merged)==null?'—':fxBest(merged)+'kg'), 2600);
}
function fxDel(athId, nm){ if(OPEN[athId]){ delete OPEN[athId][nm]; if(!Object.keys(OPEN[athId]).length) delete OPEN[athId]; } saveLocal(); render(); }
function openCard(){
  var opts=DAY.items.map(function(it){ return '<option value="'+esc(it.athId)+'"'+(it.athId===fxAth?' selected':'')+'>'+esc(it.name)+'</option>'; }).join('');
  var list=FX_LIST.map(function(n){ return '<option value="'+esc(n)+'"></option>'; }).join('');
  var rows='';
  Object.keys(OPEN).forEach(function(aid){
    var it=byId(aid); if(!it) return;
    Object.keys(OPEN[aid]).forEach(function(nm){
      var o=OPEN[aid][nm];
      rows+='<div class="fxrow"><span class="fxnm">'+esc(it.name)+'</span><span class="fxex">'+esc(nm)+'</span>'+
        '<span class="fxpr">'+esc(o.sets)+' → '+(o.est==null?'—':'<b>'+o.est+'kg</b>')+'</span>'+
        '<button onclick="fxDel(\''+aid+'\',\''+esc(nm)+'\')">删</button></div>';
    });
  });
  return '<div class="fx"><div class="hd">自由录入 · 突破测试<span class="sub">想更新谁、哪个动作就填谁 · 多 RM 自动倒推 1RM</span></div>'+
    '<div class="fxline"><select id="fxAth" onchange="fxAth=this.value">'+opts+'</select>'+
      '<input id="fxEx" list="fxListSrc" placeholder="动作（可选可自输）" value="'+esc(fxEx)+'" onchange="fxEx=this.value">'+
      '<datalist id="fxListSrc">'+list+'</datalist></div>'+
    '<div class="fxline"><input id="fxSets" placeholder="100x5 105x3" value="'+esc(fxIn)+'" oninput="fxIn=this.value;fxLive()">'+
      '<button class="big" style="flex:0 0 auto" onclick="fxAdd()">＋ 加入</button></div>'+
    '<div class="fxlive" id="fxlive"></div>'+
    (rows?('<div class="fxlist">'+rows+'</div>'):'')+
  '</div>';
}
/* ══════════ 网络超时与失败重试（2026-09-21 补）══════════
 * 为什么补：弱网下 fetch 会无限期挂住 —— 页面一直转圈，既不给失败提示，也没有重试入口。
 * 手机端最要命：队员在训练场提交后不知道自己到底提没提上去。这里给每个请求设上限：
 * 超时或网络错误一律抛错，由调用方弹「可见」提示 + 「重试」按钮（不能只 console.error）。
 * 没有 AbortController 的老浏览器退回普通 fetch —— 保持原行为，不额外制造失败。 */
var NET_TO_MS = 10000;        /* 读：10 秒 */
var NET_TO_POST_MS = 20000;   /* 写：20 秒（弱网下单次上传体较大） */
function fetchTO(url, opts, ms){
  opts = opts || {}; ms = ms || NET_TO_MS;
  if(typeof AbortController === 'undefined') return fetch(url, opts);
  var ac = new AbortController(), timedOut = false;
  var tm = setTimeout(function(){ timedOut = true; ac.abort(); }, ms);
  var o = {}; for(var k in opts) o[k] = opts[k];
  o.signal = ac.signal;
  return fetch(url, o).then(function(r){ clearTimeout(tm); return r; }, function(e){
    clearTimeout(tm);
    if(timedOut) throw new Error('请求超时（'+(ms/1000)+' 秒无响应）');
    throw e;
  });
}
/* 常驻错误条：不同于 flash/toast 的 2 秒自动消失 —— 网络坏了必须让人看见，并且有路可走 */
function netFail(msg, retryFn){
  if(typeof document === 'undefined') return;
  var el = document.getElementById('netErrBar');
  if(!el){
    el = document.createElement('div'); el.id = 'netErrBar';
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:16px;max-width:92vw;z-index:2147483647;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:#A32D2D;color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3)';
    document.body.appendChild(el);
  }
  el.innerHTML = '<span>⚠ '+esc(msg)+'</span>';
  if(retryFn){
    var b = document.createElement('button'); b.type='button'; b.textContent='重试';
    b.style.cssText = 'flex:0 0 auto;background:#fff;color:#A32D2D;border:0;border-radius:8px;padding:5px 12px;font-weight:800';
    b.onclick = function(){ hideNetFail(); retryFn(); };
    el.appendChild(b);
  }
  var x = document.createElement('button'); x.type='button'; x.textContent='✕';
  x.style.cssText = 'flex:0 0 auto;background:transparent;color:#fff;border:0;font-size:15px';
  x.onclick = hideNetFail;
  el.appendChild(x);
}
function hideNetFail(){
  if(typeof document === 'undefined') return;
  var el = document.getElementById('netErrBar'); if(el) el.remove();
}

/* 课表加载抽成函数：超时/失败时给「重试」按钮再跑一遍（原来只能靠人自己刷新页面） */
function loadDay(){
  $('hdr').textContent='正在读取今日课表…';
  fetchTO(API+'/'+encodeURIComponent(KEY)+'-day', null, NET_TO_MS).then(function(r){ return r.text(); }).then(function(t){
  if(!t){ $('hdr').textContent='云端无今日课表'; $('app').innerHTML='<div class="empty">电脑端还没上传今日课表<br><br>打开电脑端 YouthFit 就会<b>自动上传</b>今日课表（每天首次打开自动推一次）<br>推完后刷新本页即可</div>'; $('send').disabled=true; return; }
  DAY=JSON.parse(t); loadLocal(); $('send').disabled=false; hideNetFail();
  /* 拿到 ≠ 是今天的：旧日期的课表要显眼告警，否则教练照着旧重量练还不知道 */
  var stale=(DAY.at!==todayStr());
  $('hdr').innerHTML=esc(DAY.at)+' · 周'+DAY.day+(stale?' · <b style="color:#EF9F27">⚠ 非今日</b>':'');
  render();
  /* 只有「能渲染出全队表」时才加这层日期告警；旧格式课表下面那句空态已经说清楚了，别叠两层 */
  if(stale && DAY.rows && DAY.rows.length) $('app').innerHTML='<div class="empty" style="border-color:#EF9F27;background:#FAEEDA;color:#854F0B">⚠️ 这份课表是 <b>'+esc(DAY.at)+'</b> 的，不是今天（'+todayStr()+'）。<br>打开电脑端 YouthFit 会自动上传今日课表，然后刷新本页。</div>'+$('app').innerHTML;
  }).catch(function(e){
    $('hdr').textContent='网络异常';
    $('app').innerHTML='<div class="empty">读取课表失败：'+esc(e)+'<br><br>检查网络后点下方「重试」</div>';
    $('send').disabled=true;
    netFail('读取今日课表失败：'+e, loadDay);
  });
}
loadDay();

function byId(id){ return DAY.items.filter(function(x){ return x.athId===id; })[0]; }
/* 逐人录入视图 2026-09-21 按用户要求下线 —— 手机上一页要滑到底太费事，只保留全队一张表 */
function render(){ renderTeamView(); }
async function send(){
  var items=DAY.items.filter(function(it){ return Object.keys(LOG[it.athId]||{}).some(function(k){ return (LOG[it.athId][k]||'').trim(); }) || Object.keys(OPEN[it.athId]||{}).length; });
  var bad=0;   /* 填了但解析不出组数的格子数 */
  if(!items.length){ toast('还没有录入任何数据'); return; }
  $('send').disabled=true; $('send').textContent='回传中…';
  try{
    /* ⚠️ 这一步失败必须中止整个回传：old 拿不到就只剩今天的记录，照发会把云端历史覆盖掉 */
    var old=[];
    try{
      var t=await fetchTO(API+'/'+encodeURIComponent(KEY)+'-log', null, NET_TO_MS).then(function(r){ return r.text(); });
      old=t?JSON.parse(t):[];
    }catch(e){ throw new Error('读回旧记录失败（'+e.message+'）—— 已中止回传，避免覆盖云端历史'); }
    if(!Array.isArray(old)) old=[];
    items.forEach(function(it){
      var r=LOG[it.athId]||{}, ex=[], pr={};
      /* 遍历「实际填了的格子」而不是 it.ex —— 全队表里热身 / 辅助 / 放松行也能回传 */
      Object.keys(r).forEach(function(nm){
        var sets=expandTok(r[nm], repsOfRow(nm)); if(!sets.length){ bad++; return; }
        ex.push({name:nm, plan:planTxtOf(it, nm), sets:sets});
        var best=null; sets.forEach(function(s){ var v=est1RM(s[0],s[1]); if(v&&(!best||v>best)) best=v; });
        if(best!=null) pr[nm]=best;
      });
      /* 自由录入（突破测试）：任何动作、任何次数，合并进同一份回传 */
      var op=OPEN[it.athId]||{};
      Object.keys(op).forEach(function(nm){
        var sets=parseTok(op[nm].sets); if(!sets.length) return;
        ex.push({name:nm, plan:'自由录入', sets:sets});
        var b=null; sets.forEach(function(s){ var v=est1RM(s[0],s[1]); if(v&&(!b||v>b)) b=v; });
        if(b!=null && (pr[nm]==null || b>pr[nm])) pr[nm]=b;
      });
      if(!ex.length) return;
      old=old.filter(function(x){ return !(x.at===DAY.at && x.athId===it.athId); });
      old.push({at:DAY.at, athId:it.athId, name:it.name, ex:ex, pr:pr, ts:Date.now()});
      SENT[it.athId]=1;
    });
    var body='key='+encodeURIComponent(KEY+'-log')+'&value='+encodeURIComponent(JSON.stringify(old));
    var res=await fetchTO(API+'/update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}, NET_TO_POST_MS).then(function(r){ return r.json(); });
    if(res.status!==1) throw new Error('云端返回 '+JSON.stringify(res).slice(0,60));
    saveLocal(); render();
    hideNetFail();
    toast('✅ 已回传 '+items.length+' 人 —— 电脑端点「拉取训练记录」并入'+(bad?('（另有 '+bad+' 格不是数字，没回传）'):''), bad?4500:3000);
  }catch(e){
    toast('回传失败：'+e+'（数据已存本机）', 3500);
    netFail('回传给电脑端失败：'+e+'（数据已存本机，可点重试）', send);
  }
  $('send').disabled=false; $('send').textContent='📤 一键回传';
}

/* ══════════ 全队一张表（行=动作 / 列=队员）2026-09-18 ══════════
 * 数据由电脑端 buildDayPlanPayload v2 下发（rows + 每人 cells），与 A4 打印表同源。
 * 灰字 = 计划（电脑端按最近 1RM 算的）；和计划不一样就填进去，一样留空 —— 与纸表同一口径。
 * 填格只写 LOG + 改该格样式，**不重绘**：否则横向滚动位置会跳、光标会丢，没法连着填。 */
var RI=null;
function rowsIndex(nm){
  if(!DAY || !DAY.rows) return -1;
  if(!RI){ RI={}; DAY.rows.forEach(function(r,i){ RI[r.name]=i; }); }
  var v=RI[nm]; return (v==null?-1:v);
}
function cellPlan(it, nm){
  if(!it || !it.cells) return '';
  var i=rowsIndex(nm); if(i<0) return '';
  var v=it.cells[i]; return (v==null?'':String(v));
}
function repsOfRow(nm){
  if(DAY && DAY.rows){ for(var i=0;i<DAY.rows.length;i++){ if(DAY.rows[i].name===nm) return DAY.rows[i].reps; } }
  return '';
}
/* 只填重量（如 52.5）→ 用该行计划次数补齐；写 52.5x5 就按写的来 */
function expandTok(raw, reps){
  var t=parseTok(raw);
  if(t.length) return t;
  var w=num(raw); if(w==null || !(w>0)) return [];
  var r=parseInt(String(reps==null?'':reps).replace(/[^\d]/g,''),10) || 5;
  return [[w, r]];
}
function planTxtOf(it, nm){
  var p=cellPlan(it, nm);
  if(p) return p;
  return String(repsOfRow(nm)||'');
}
function setTeamCellEl(inp){
  var aid=inp.getAttribute('data-a'), nm=inp.getAttribute('data-e'), v=String(inp.value||'').trim();
  LOG[aid]=LOG[aid]||{};
  if(v) LOG[aid][nm]=v; else delete LOG[aid][nm];
  saveLocal();
  /* 非数字（例如写了「完成」）留得下、但回传不出去 —— 标黄，别让人以为已经录上了 */
  var bad=(v && !expandTok(v, inp.getAttribute('data-reps')).length);
  inp.className='mxi'+(bad?' bad':(v?' filled':''));
  updateFoot();
}
function updateFoot(){
  var filled=0, openN=0;
  Object.keys(LOG).forEach(function(k){ filled += Object.keys(LOG[k]||{}).length; });
  Object.keys(OPEN).forEach(function(k){ openN += Object.keys(OPEN[k]||{}).length; });
  $('st').textContent='已填 '+filled+' 格'+(openN?(' · 自由 '+openN+' 项'):'');
  $('send').disabled=(filled===0 && openN===0);
}
function escAttr(s){ return esc(String(s==null?'':s)).replace(/"/g,'&quot;'); }
/* 表头吸顶要生效，滚动容器必须有**确定高度**：按视口把「表格区顶部 → 页脚上沿」的剩余空间写给它。
   ⚠️ 只算一次不够 —— 手机上转屏、地址栏收放都会变高度，所以挂了 resize / orientationchange。 */
function fitMx(){
  var w=document.querySelector('.mxwrap'); if(!w) return;
  var r=w.getBoundingClientRect();
  var f=document.querySelector('footer');
  w.style.maxHeight=Math.max(200, Math.round(window.innerHeight - r.top - (f?f.offsetHeight:0) - 14))+'px';
}
window.addEventListener('resize', fitMx);
window.addEventListener('orientationchange', fitMx);
function renderTeamView(){
  if(!DAY.rows || !DAY.rows.length){
    RI=null;
    $('app').innerHTML='<div class="empty">云端这份课表还是旧格式（缺「全队表」数据）。<br><br>'+
      '打开电脑端 YouthFit 会自动推送新格式课表<br>（每天首次打开自动推一次）→ 推完刷新本页即可。</div>';
    $('prog').textContent=''; $('hint').textContent='';
    updateFoot();
    return;
  }
  var segName={}, segMin={};
  (DAY.segs||[]).forEach(function(s){ segName[s.k]=s.n; segMin[s.k]=s.m; });
  var n=DAY.items.length;
  var head='<thead><tr><th class="mxfx">动作</th><th class="mxpx">处方</th>'+
    DAY.items.map(function(it){ return '<th class="mxath">'+esc(it.name)+'</th>'; }).join('')+'</tr></thead>';
  var body='';
  DAY.rows.forEach(function(r, ri){
    if(ri===0 || DAY.rows[ri-1].seg!==r.seg){
      body+='<tr class="mxseg"><td colspan="'+(2+n)+'">'+esc(segName[r.seg]||r.seg)+
        (segMin[r.seg]?(' · '+segMin[r.seg]+'′'):'')+'</td></tr>';
    }
    var presc=r.sets+' × '+esc(String(r.reps))+(r.pct!=null?(' @'+Math.round(r.pct*100)+'%'):'');
    var tds=DAY.items.map(function(it){
      var plan=cellPlan(it, r.name);
      if(plan==='自重' || plan==='无负重') return '<td class="mxna">'+esc(plan)+'</td>';
      if(plan==='') return '<td class="mxna">·</td>';
      var v=(LOG[it.athId]||{})[r.name]||'';
      return '<td class="mxcell"><input class="mxi'+(v?' filled':'')+'" type="text" inputmode="decimal"'+
        ' data-a="'+escAttr(it.athId)+'" data-e="'+escAttr(r.name)+'" data-reps="'+escAttr(String(r.reps))+'"'+
        ' value="'+escAttr(v)+'" placeholder="'+escAttr(plan)+'" oninput="setTeamCellEl(this)"></td>';
    }).join('');
    body+='<tr'+(r.add?' class="mxadd"':'')+'><td class="mxfx">'+
      esc(String(r.name).replace(/^弱项(加练|补强) · /,''))+(r.add?' <em>加练</em>':'')+
      '</td><td class="mxpx">'+presc+'</td>'+tds+'</tr>';
  });
  $('app').innerHTML='<div class="mxwrap"><table class="mx">'+head+'<tbody>'+body+'</tbody></table></div>'+openCard();
  $('prog').textContent='已填 '+Object.keys(LOG).reduce(function(s,k){ return s+Object.keys(LOG[k]||{}).length; },0)+' 个格子';
  $('hint').textContent='灰字 = 计划（按最近 1RM 算）· 实际不一样就填进去（52.5 或 52.5x5）· 一样留空 · 填完点下方「一键回传」。只认数字，写了别的字会标黄、不回传。';
  updateFoot();
  fitMx();   /* 表格区按视口定高，表头才吸得住 */
}

</script>
</body>
</html>
